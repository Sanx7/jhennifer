<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossa Galeria</title>
    <style>
        /* Estilos Gerais */
        body {
            background-color: #fce4ec; /* Rosa Bebê */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #d32f2f; /* Vermelho */
            font-size: 3rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        /* Corações decorativos */
        .coracao {
            color: #ff5252;
            position: fixed;
            font-size: 20px;
            z-index: -1;
            opacity: 0.6;
        }

        /* Grid da Galeria */
        .galeria-container {
            display: grid;
            /* Cria 3 colunas no PC e ajusta sozinho no celular */
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            max-width: 1200px;
            width: 100%;
        }

        /* Cada slot de foto */
        .foto-card {
            background-color: white;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            text-align: center;
            cursor: pointer; /* Transforma o mouse em mãozinha indicando clique */
        }

        .foto-card:hover {
            transform: scale(1.05); /* Efeito de zoom ao passar o mouse */
        }

        .foto-card img {
            width: 100%;
            height: 250px;
            object-fit: cover; /* Faz a foto preencher o quadrado sem distorcer */
            border-radius: 10px;
        }

        .legenda {
            color: #555;
            font-style: italic;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .botao-voltar {
            margin-top: 40px;
            text-decoration: none;
            color: white;
            background-color: #ff5252;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
        }

        /* --- ESTILOS DO MODAL (TELA CHEIA) --- */
        .lightbox {
            display: none; /* Escondido por padrão */
            position: fixed;
            z-index: 999; /* Fica acima de tudo */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9); /* Fundo preto semi-transparente */
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* Classe que varia o efeito visual */
        .lightbox.ativo {
            display: flex;
            opacity: 1;
        }

        .lightbox-img {
            max-width: 90%;
            max-height: 80%;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .lightbox.ativo .lightbox-img {
            transform: scale(1); /* Efeito suave de abertura */
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }

        .lightbox-legend {
            position: absolute;
            bottom: 40px;
            color: white;
            font-size: 1.2rem;
            font-style: italic;
            text-align: center;
            width: 80%;
        }
    </style>
</head>
<body>

    <div class="coracao" style="top: 10%; left: 5%;">❤</div>
    <div class="coracao" style="top: 20%; right: 10%;">❤</div>
    <div class="coracao" style="bottom: 15%; left: 8%;">❤</div>
    <div class="coracao" style="bottom: 5%; right: 5%;">❤</div>

    <h1>Nossa Galeria</h1>

    <div class="galeria-container">
        
        <div class="foto-card">
            <img src="foto1.jpg" alt="primeiro eu te amo">
            <p class="legenda">primeiro eu te amo</p>
        </div>

        <div class="foto-card">
            <img src="foto2.png" alt="nós fofinhos">
            <p class="legenda">nós fofinhos</p>
        </div>

        <div class="foto-card">
            <img src="foto3.jpg" alt="call longa">
            <p class="legenda">call longa</p>
        </div>

        <div class="foto-card">
            <img src="foto4.jpg" alt="eita">
            <p class="legenda">eita</p>
        </div>

        <div class="foto-card">
            <img src="foto5.jpg" alt="minha patinha">
            <p class="legenda">minha patinha</p>
        </div>

        <div class="foto-card">
            <img src="foto6.jpg" alt="depressiva">
            <p class="legenda">depressiva</p>
        </div>

        <div class="foto-card">
            <img src="foto7.jpg" alt="eu tinha medo">
            <p class="legenda">eu tinha medo</p>
        </div>

        <div class="foto-card">
            <img src="foto8.jpg" alt="nrossas discussões">
            <p class="legenda">nossas discussões</p>
        </div>

        <div class="foto-card">
            <img src="foto9.jpg" alt="delicia">
            <p class="legenda">delicia</p>
        </div>

        <div class="foto-card">
            <img src="foto10.jpg" alt="certidao de casamento">
            <p class="legenda">certidao de casamento</p>
        </div>

        <div class="foto-card"><img src="https://via.placeholder.com/300" alt="Foto 11"><p class="legenda">Legenda da foto 11.</p></div>
        <div class="foto-card"><img src="https://via.placeholder.com/300" alt="Foto 12"><p class="legenda">Legenda da foto 12.</p></div>

    </div>

    <a href="index.html" class="botao-voltar">Voltar para a Home</a>

    <div id="lightbox" class="lightbox">
        <span class="lightbox-close" id="lightbox-close">&times;</span>
        <img class="lightbox-img" id="lightbox-img" src="" alt="">
        <p class="lightbox-legend" id="lightbox-legend"></p>
    </div>

    <script>
        const cards = document.querySelectorAll('.foto-card');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxLegend = document.getElementById('lightbox-legend');
        const lightboxClose = document.getElementById('lightbox-close');

        // Abrir imagem ao clicar no card
        cards.forEach(card => {
            card.addEventListener('click', () => {
                const img = card.querySelector('img');
                const legenda = card.querySelector('.legenda');
                
                lightboxImg.src = img.src;
                lightboxImg.alt = img.alt;
                lightboxLegend.textContent = legenda.textContent;
                
                lightbox.classList.add('ativo');
            });
        });

        // Fechar ao clicar no 'X'
        lightboxClose.addEventListener('click', () => {
            lightbox.classList.remove('ativo');
        });

        // Fechar ao clicar no fundo escuro (fora da imagem)
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                lightbox.classList.remove('ativo');
            }
        });
    </script>

</body>
</html>

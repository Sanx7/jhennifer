<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>minha surpresa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="envelope-wrapper">
            <div class="envelope">
                <div class="back"></div>
                <div class="letter">
                    <img src="Jhe.png" alt="Minha Carta" id="carta-img">
                </div>
                <div class="front"></div>
                <div class="top"></div>
            </div>
        </div>
        <p class="instrucao">Passe o mouse (ou clique) para abrir</p>
    </div>

    <div id="fullscreen-modal" class="modal">
        <span class="fechar">&times;</span>
        <img class="modal-conteudo" id="img-fullscreen">
    </div>

    <script>
        const modal = document.getElementById("fullscreen-modal");
        const imgCarta = document.getElementById("carta-img");
        const imgModal = document.getElementById("img-fullscreen");
        const botaoFechar = document.querySelector(".fechar");

        // Quando clicar na imagem da carta, abre a tela cheia
        imgCarta.addEventListener("click", function() {
            modal.style.display = "flex";
            imgModal.src = this.src;
        });

        // Quando clicar no 'X' ou no fundo preto, fecha a tela cheia
        botaoFechar.addEventListener("click", () => modal.style.display = "none");
        modal.addEventListener("click", (e) => {
            if (e.target === modal) modal.style.display = "none";
        });
    </script>

</body>
</html>
